# The in-process device simulator that the test suite drives keeps some state in
# C statics, so two tests talking to two simulated dongles at once interfere with
# each other. Every language binding's suite runs serially for that reason; here
# it is made automatic rather than a flag people have to remember, because the
# failure looks like a flaky dongle rather than like a test-harness problem.
#
# It affects this crate's own tests only, not anything that depends on it: a real
# dongle is one device, and the C ABI's threading rules are documented in
# `include/licdongle.h`.
[env]
RUST_TEST_THREADS = "1"
