name: keynub_licdongle
description: >-
  Client for the KeyNub USB license dongle: verify it is genuine, read and write
  license records, use its counters, encrypt data only a dongle can decrypt.
  Pure Dart over dart:ffi.
version: 1.1.1
homepage: https://www.keynub.com/developers/dart/
repository: https://github.com/AB-KeyNub/KeyNub-SDK
issue_tracker: https://github.com/AB-KeyNub/KeyNub-SDK/issues
topics:
  - licensing
  - copy-protection
  - usb
  - ffi
  - hardware

environment:
  sdk: ^3.3.0

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
